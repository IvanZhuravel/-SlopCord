name: Build Windows app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npx tauri build
        env:
          # Built into the app so friends do not have to type it. Set it under
          # Settings -> Secrets and variables -> Actions. Empty: the app asks for it.
          VITE_LIVEKIT_TOKEN_SERVER_ID: ${{ secrets.LIVEKIT_TOKEN_SERVER_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: SlopCord-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
