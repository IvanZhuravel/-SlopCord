[package]
name = "slopcord"
version = "0.1.0"
description = "SlopCord voice chat"
edition = "2021"

[lib]
name = "slopcord_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

# Small and fast release binary: the app must not get in the way of games.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
